<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Juego de la Culebrita - Crecimiento Continuo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-container {
      text-align: center;
      background-color: #161b22;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #30363d;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #58a6ff;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      background-color: #21262d;
      padding: 10px;
      border-radius: 6px;
    }

    .level-tag { color: #f29d38; }
    #score { color: #2ea043; }
    #target-score { color: #a371f7; }
    #high-score { color: #e3b341; }

    .canvas-wrapper {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      position: relative;
    }

    canvas {
      background-color: #000000;
      border: 2px solid #30363d;
      border-radius: 6px;
      display: block;
      width: 100%;
      height: auto;
    }

    /* Overlay modal integrado */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
      color: #ffffff;
      z-index: 10;
      padding: 20px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 22px;
      color: #58a6ff;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 16px;
    }

    .overlay button {
      background-color: #2ea043;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .overlay button:active {
      background-color: #268435;
    }

    /* Controles D-Pad */
    .dpad-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
    }

    .dpad-row {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dpad-center {
      width: 55px;
      height: 55px;
    }

    .dpad-btn {
      width: 55px;
      height: 55px;
      background-color: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 3px;
      transition: background-color 0.1s;
    }

    .dpad-btn:active {
      background-color: #30363d;
      transform: scale(0.95);
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🐍 Culebrita 20 Niveles</h1>
    
    <div class="score-board">
      <div class="level-tag">Nivel: <span id="level">1</span>/20</div>
      <div>Puntos: <span id="score">0</span>/<span id="target-score">100</span></div>
      <div>Máx: <span id="high-score">0</span></div>
    </div>
    
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <div id="overlay" class="overlay hidden">
        <h2 id="overlay-title">¡Nivel Superado!</h2>
        <p id="overlay-desc">Preparando siguiente nivel...</p>
        <button id="overlay-btn">Continuar</button>
      </div>
    </div>

    <!-- Controles táctiles -->
    <div class="dpad-container">
      <div class="dpad-row">
        <button id="btn-up" class="dpad-btn">▲</button>
      </div>
      <div class="dpad-row">
        <button id="btn-left" class="dpad-btn">◄</button>
        <div class="dpad-center"></div>
        <button id="btn-right" class="dpad-btn">►</button>
      </div>
      <div class="dpad-row">
        <button id="btn-down" class="dpad-btn">▼</button>
      </div>
    </div>

    <div class="controls-hint">
      Mantiene posición, dirección y tamaño entre niveles.
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const targetScoreElement = document.getElementById("target-score");
    const levelElement = document.getElementById("level");
    const highScoreElement = document.getElementById("high-score");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayDesc = document.getElementById("overlay-desc");
    const overlayBtn = document.getElementById("overlay-btn");

    const grid = 20;
    let count = 0;
    let score = 0;
    let currentLevel = 1;
    let maxLevels = 20;
    let isPaused = false;
    let pendingAction = null;

    let highScore = localStorage.getItem("snakeHighScoreLevels") || 0;
    highScoreElement.innerText = highScore;

    let snake = {
      x: 160,
      y: 160,
      dx: grid,
      dy: 0,
      cells: [],
      maxCells: 4
    };

    let apple = { x: 320, y: 320 };
    let obstacles = [];

    function getLevelConfig(lvl) {
      const targetScore = lvl * 100;
      const speedStep = Math.max(2, Math.floor(9 - (lvl * 0.35)));
      return { targetScore, speedStep };
    }

    function generateObstacles(lvl) {
      let obs = [];
      if (lvl >= 3 && lvl < 6) {
        for(let i = -1; i <= 1; i++) {
          for(let j = -1; j <= 1; j++) {
            obs.push({ x: 260 + i * grid, y: 260 + j * grid });
          }
        }
      } else if (lvl >= 6 && lvl < 10) {
        const positions = [
          [60, 60], [60, 80], [80, 60],
          [320, 60], [320, 80], [300, 60],
          [60, 320], [60, 300], [80, 320],
          [320, 320], [300, 320], [320, 300]
        ];
        positions.forEach(p => obs.push({ x: p[0], y: p[1] }));
      } else if (lvl >= 10 && lvl < 15) {
        for (let i = 60; i <= 340; i += 20) {
          obs.push({ x: i, y: 240 });
          obs.push({ x: 240, y: i });
        }
      } else if (lvl >= 15) {
        for (let i = 40; i <= 340; i += 40) {
          obs.push({ x: i, y: 80 });
          obs.push({ x: 400 - i, y: 320 });
        }
      }

      // Zona de seguridad: No generar obstáculos sobre el cuerpo ni cerca de la cabeza
      return obs.filter(o => {
        const overlapsBody = snake.cells.some(cell => cell.x === o.x && cell.y === o.y);
        const nearHead = Math.abs(o.x - snake.x) <= grid * 3 && Math.abs(o.y - snake.y) <= grid * 3;
        return !overlapsBody && !nearHead;
      });
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function placeApple() {
      let valid = false;
      while (!valid) {
        apple.x = getRandomInt(0, 20) * grid;
        apple.y = getRandomInt(0, 20) * grid;
        
        valid = true;
        for (let cell of snake.cells) {
          if (cell.x === apple.x && cell.y === apple.y) { valid = false; break; }
        }
        for (let obs of obstacles) {
          if (obs.x === apple.x && obs.y === apple.y) { valid = false; break; }
        }
      }
    }

    function loadLevel(lvl) {
      currentLevel = lvl;
      levelElement.innerText = currentLevel;
      const config = getLevelConfig(currentLevel);
      targetScoreElement.innerText = config.targetScore;

      // Se conserva la posición, células y dirección sin resetear nada
      obstacles = generateObstacles(currentLevel);
      placeApple();
    }

    function showOverlay(title, desc, btnText, action) {
      overlayTitle.innerText = title;
      overlayDesc.innerText = desc;
      overlayBtn.innerText = btnText;
      overlay.classList.remove("hidden");
      isPaused = true;
      pendingAction = action;
    }

    overlayBtn.addEventListener("click", () => {
      overlay.classList.add("hidden");
      isPaused = false;
      if (pendingAction) {
        const act = pendingAction;
        pendingAction = null;
        act();
      }
    });

    function triggerLevelSuccess() {
      if (currentLevel < maxLevels) {
        showOverlay(
          `¡Nivel ${currentLevel} Superado!`,
          `Siguiente desafío: Nivel ${currentLevel + 1}. Mantenes tu posición y tamaño.`,
          "¡Continuar!",
          () => {
            loadLevel(currentLevel + 1);
          }
        );
      } else {
        showOverlay(
          "¡FELICIDADES!",
          "¡Has superado los 20 Niveles del juego!",
          "Volver a Jugar",
          () => {
            resetGame();
          }
        );
      }
    }

    function triggerGameOver(reason) {
      showOverlay(
        "¡Juego Terminado!",
        reason,
        "Reintentar",
        () => {
          resetGame();
        }
      );
    }

    function resetGame() {
      score = 0;
      scoreElement.innerText = score;
      
      // Solo vuelve al centro al perder el juego
      snake.x = 160;
      snake.y = 160;
      snake.dx = grid;
      snake.dy = 0;
      snake.maxCells = 4;
      snake.cells = [];
      for (let i = 0; i < snake.maxCells; i++) {
        snake.cells.push({ x: 160 - (i * grid), y: 160 });
      }

      loadLevel(1);
    }

    function loop() {
      requestAnimationFrame(loop);

      if (isPaused) return;

      const config = getLevelConfig(currentLevel);

      if (++count < config.speedStep) return;
      count = 0;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snake.x += snake.dx;
      snake.y += snake.dy;

      if (snake.x < 0) snake.x = canvas.width - grid;
      else if (snake.x >= canvas.width) snake.x = 0;

      if (snake.y < 0) snake.y = canvas.height - grid;
      else if (snake.y >= canvas.height) snake.y = 0;

      snake.cells.unshift({ x: snake.x, y: snake.y });

      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // Dibujar Obstáculos
      ctx.fillStyle = "#8b949e";
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, grid - 1, grid - 1);
      });

      // Dibujar Manzana
      ctx.fillStyle = "#f85149";
      ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      // Dibujar Culebrita
      ctx.fillStyle = "#2ea043";

      let ateApple = false;
      let crashedSelf = false;
      let crashedObs = false;

      snake.cells.forEach((cell, index) => {
        ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        // Comer manzana
        if (cell.x === apple.x && cell.y === apple.y) {
          ateApple = true;
        }

        // Colisión consigo misma
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            crashedSelf = true;
          }
        }

        // Colisión con Obstáculos
        for (let obs of obstacles) {
          if (cell.x === obs.x && cell.y === obs.y) {
            crashedObs = true;
          }
        }
      });

      if (crashedSelf) {
        triggerGameOver("Chocaste contigo mismo.");
        return;
      }

      if (crashedObs) {
        triggerGameOver("Chocaste con un obstáculo.");
        return;
      }

      if (ateApple) {
        snake.maxCells++;
        score += 10;
        scoreElement.innerText = score;

        if (score > highScore) {
          highScore = score;
          highScoreElement.innerText = highScore;
          localStorage.setItem("snakeHighScoreLevels", highScore);
        }

        if (score >= config.targetScore) {
          triggerLevelSuccess();
        } else {
          placeApple();
        }
      }
    }

    function moveUp() { if (!isPaused && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; } }
    function moveDown() { if (!isPaused && snake.dy === 0) { snake.dy = grid; snake.dx = 0; } }
    function moveLeft() { if (!isPaused && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; } }
    function moveRight() { if (!isPaused && snake.dx === 0) { snake.dx = grid; snake.dy = 0; } }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
      else if (e.key === "ArrowUp" || e.key === "w") moveUp();
      else if (e.key === "ArrowRight" || e.key === "d") moveRight();
      else if (e.key === "ArrowDown" || e.key === "s") moveDown();
    });

    document.getElementById("btn-up").addEventListener("click", moveUp);
    document.getElementById("btn-down").addEventListener("click", moveDown);
    document.getElementById("btn-left").addEventListener("click", moveLeft);
    document.getElementById("btn-right").addEventListener("click", moveRight);

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, false);

    canvas.addEventListener("touchend", (e) => {
      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 20) moveRight();
        else if (diffX < -20) moveLeft();
      } else {
        if (diffY > 20) moveDown();
        else if (diffY < -20) moveUp();
      }
    }, false);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
