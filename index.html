<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego de la Culebrita - Crecimiento Continuo Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Configuración por defecto: Estática para PC */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita cualquier scroll en escritorio */
      background-color: #090d12;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      text-align: center;
      background-color: #121720;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #2d3544;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75), 0 0 15px rgba(88, 166, 255, 0.1);
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      color: #58a6ff;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .icon-btn:hover, .icon-btn:active {
      background-color: #30363d;
      border-color: #58a6ff;
    }

    .score-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
      background-color: #1a202c;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2b3245;
    }

    .score-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #8b949e;
      letter-spacing: 0.5px;
    }

    .level-val { color: #f29d38; }
    .score-val { color: #2ea043; }
    .high-val { color: #e3b341; }

    /* Barra de progreso de nivel */
    .progress-container {
      width: 100%;
      height: 6px;
      background-color: #1a202c;
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid #2b3245;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2ea043, #3fb950);
      transition: width 0.2s ease-out;
    }

    .canvas-wrapper {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      position: relative;
    }

    canvas {
      background-color: #05080c;
      border: 2px solid #2d3544;
      border-radius: 10px;
      display: block;
      width: 100%;
      height: auto;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    /* Modal Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 18, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      color: #ffffff;
      z-index: 10;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 22px;
      color: #58a6ff;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 18px;
      max-width: 80%;
      line-height: 1.4;
    }

    .overlay button {
      background: linear-gradient(135deg, #2ea043, #238636);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
      transition: transform 0.1s, box-shadow 0.15s;
    }

    .overlay button:active {
      transform: scale(0.96);
      box-shadow: 0 2px 6px rgba(46, 160, 67, 0.2);
    }

    /* Controles D-Pad (Ocultos por defecto en PC) */
    .dpad-container {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 14px;
    }

    .dpad-row {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dpad-center {
      width: 52px;
      height: 52px;
    }

    .dpad-btn {
      width: 52px;
      height: 52px;
      background-color: #1a202c;
      color: #58a6ff;
      border: 1px solid #2b3245;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 3px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: background-color 0.1s, transform 0.1s;
    }

    .dpad-btn:active {
      background-color: #2d3544;
      color: #3fb950;
      transform: scale(0.92);
    }

    .controls-hint {
      margin-top: 10px;
      font-size: 11px;
      color: #6e7681;
    }

    /* --- ADAPTACIÓN RESPONSIVA PARA DISPOSITIVOS MÓVILES --- */
    @media (hover: none) and (pointer: coarse), (max-width: 768px) {
      html, body {
        overflow: auto; /* Permite scroll adaptativo en pantallas pequeñas */
        align-items: flex-start;
        padding: 10px;
      }

      .dpad-container {
        display: flex; /* Se activan los botones táctiles */
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header-bar">
      <h1>🐍 Culebrita 20 Niveles</h1>
      <div>
        <button id="btn-sound" class="icon-btn" title="Sonido">🔊</button>
        <button id="btn-pause" class="icon-btn" title="Pausar">⏸</button>
      </div>
    </div>

    <div class="score-board">
      <div class="score-card">
        <span class="score-label">Nivel</span>
        <span class="level-val"><span id="level">1</span> / 20</span>
      </div>
      <div class="score-card">
        <span class="score-label">Puntos</span>
        <span class="score-val"><span id="score">0</span> / <span id="target-score">100</span></span>
      </div>
      <div class="score-card">
        <span class="score-label">Máximo</span>
        <span class="high-val" id="high-score">0</span>
      </div>
    </div>

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <h2 id="overlay-title">¡Bienvenido!</h2>
        <p id="overlay-desc">Supera los 20 niveles. Tu culebrita conservará su posición y tamaño entre niveles.</p>
        <button id="overlay-btn">Iniciar Juego</button>
      </div>
    </div>

    <!-- Controles táctiles D-Pad (se muestran automáticamente en móvil) -->
    <div id="dpad" class="dpad-container">
      <div class="dpad-row">
        <button id="btn-up" class="dpad-btn">▲</button>
      </div>
      <div class="dpad-row">
        <button id="btn-left" class="dpad-btn">◄</button>
        <div class="dpad-center"></div>
        <button id="btn-right" class="dpad-btn">►</button>
      </div>
      <div class="dpad-row">
        <button id="btn-down" class="dpad-btn">▼</button>
      </div>
    </div>

    <div id="hint-text" class="controls-hint">
      Teclas: Flechas / WASD | Pausa: P o ESC
    </div>
  </div>

  <script>
    // --- DETECCIÓN DE DISPOSITIVO MÓVIL ---
    const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth <= 768;

    const hintText = document.getElementById("hint-text");
    if (isMobile) {
      hintText.innerText = "Desliza en pantalla o usa la cruceta táctil";
    }

    // --- SINTETIZADOR DE SONIDO (Web Audio API) ---
    class SoundManager {
      constructor() {
        this.audioCtx = null;
        this.muted = false;
      }

      init() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContext();
        }
      }

      playEat() {
        if (this.muted) return;
        this.init();
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.08);
      }

      playGolden() {
        if (this.muted) return;
        this.init();
        const now = this.audioCtx.currentTime;
        [400, 600, 900, 1200].forEach((freq, idx) => {
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.04);
          gain.gain.setValueAtTime(0.12, now + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.04 + 0.08);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start(now + idx * 0.04);
          osc.stop(now + idx * 0.04 + 0.08);
        });
      }

      playLevelUp() {
        if (this.muted) return;
        this.init();
        const now = this.audioCtx.currentTime;
        [350, 450, 550, 700, 900].forEach((freq, idx) => {
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.08, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.12);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.12);
        });
      }

      playGameOver() {
        if (this.muted) return;
        this.init();
        const now = this.audioCtx.currentTime;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.35);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    const sound = new SoundManager();

    // --- ELEMENTOS DEL DOM ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const targetScoreElement = document.getElementById("target-score");
    const levelElement = document.getElementById("level");
    const highScoreElement = document.getElementById("high-score");
    const progressBar = document.getElementById("progress-bar");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayDesc = document.getElementById("overlay-desc");
    const overlayBtn = document.getElementById("overlay-btn");
    const btnSound = document.getElementById("btn-sound");
    const btnPause = document.getElementById("btn-pause");

    // --- VARIABLES DE JUEGO ---
    const grid = 20;
    let count = 0;
    let score = 0;
    let levelStartScore = 0;
    let currentLevel = 1;
    let maxLevels = 20;
    let isPaused = true;
    let pendingAction = null;
    let inputsQueue = [];

    let highScore = localStorage.getItem("snakeHighScoreLevels") || 0;
    highScoreElement.innerText = highScore;

    let snake = {
      x: 160,
      y: 160,
      dx: grid,
      dy: 0,
      cells: [],
      maxCells: 4
    };

    let apple = { x: 320, y: 320 };
    let goldenApple = null;
    let obstacles = [];
    let particles = [];

    // --- SISTEMA DE PARTÍCULAS ---
    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + grid / 2,
          y: y + grid / 2,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1.0,
          decay: 0.03 + Math.random() * 0.03,
          color: color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;
    }

    // --- CONFIGURACIÓN DE NIVELES ---
    function getLevelConfig(lvl) {
      const targetScore = lvl * 100;
      const speedStep = Math.max(2, Math.floor(9 - (lvl * 0.35)));
      return { targetScore, speedStep };
    }

    function generateObstacles(lvl) {
      let obs = [];
      if (lvl >= 3 && lvl < 6) {
        for (let i = -1; i <= 1; i++) {
          for (let j = -1; j <= 1; j++) {
            obs.push({ x: 260 + i * grid, y: 260 + j * grid });
          }
        }
      } else if (lvl >= 6 && lvl < 10) {
        const positions = [
          [60, 60], [60, 80], [80, 60],
          [320, 60], [320, 80], [300, 60],
          [60, 320], [60, 300], [80, 320],
          [320, 320], [300, 320], [320, 300]
        ];
        positions.forEach(p => obs.push({ x: p[0], y: p[1] }));
      } else if (lvl >= 10 && lvl < 15) {
        for (let i = 60; i <= 340; i += 20) {
          obs.push({ x: i, y: 240 });
          obs.push({ x: 240, y: i });
        }
      } else if (lvl >= 15) {
        for (let i = 40; i <= 340; i += 40) {
          obs.push({ x: i, y: 80 });
          obs.push({ x: 400 - i, y: 320 });
        }
      }

      return obs.filter(o => {
        const overlapsBody = snake.cells.some(cell => cell.x === o.x && cell.y === o.y);
        const nearHead = Math.abs(o.x - snake.x) <= grid * 3 && Math.abs(o.y - snake.y) <= grid * 3;
        return !overlapsBody && !nearHead;
      });
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function placeApple() {
      let valid = false;
      while (!valid) {
        apple.x = getRandomInt(0, 20) * grid;
        apple.y = getRandomInt(0, 20) * grid;

        valid = true;
        for (let cell of snake.cells) {
          if (cell.x === apple.x && cell.y === apple.y) { valid = false; break; }
        }
        for (let obs of obstacles) {
          if (obs.x === apple.x && obs.y === apple.y) { valid = false; break; }
        }
      }
    }

    function trySpawnGoldenApple() {
      if (goldenApple || Math.random() > 0.3) return;
      let valid = false;
      let gx = 0, gy = 0;

      while (!valid) {
        gx = getRandomInt(0, 20) * grid;
        gy = getRandomInt(0, 20) * grid;
        valid = true;

        if (gx === apple.x && gy === apple.y) valid = false;
        for (let cell of snake.cells) {
          if (cell.x === gx && cell.y === gy) { valid = false; break; }
        }
        for (let obs of obstacles) {
          if (obs.x === gx && obs.y === gy) { valid = false; break; }
        }
      }

      goldenApple = { x: gx, y: gy, timer: 120 };
    }

    function updateProgressBar() {
      const config = getLevelConfig(currentLevel);
      const levelTarget = config.targetScore - levelStartScore;
      const currentProgress = Math.max(0, score - levelStartScore);
      const pct = Math.min(100, (currentProgress / levelTarget) * 100);
      progressBar.style.width = pct + "%";
    }

    function loadLevel(lvl) {
      currentLevel = lvl;
      levelElement.innerText = currentLevel;
      const config = getLevelConfig(currentLevel);
      targetScoreElement.innerText = config.targetScore;

      levelStartScore = (lvl === 1) ? 0 : (lvl - 1) * 100;
      updateProgressBar();

      obstacles = generateObstacles(currentLevel);
      goldenApple = null;
      placeApple();
    }

    function showOverlay(title, desc, btnText, action) {
      overlayTitle.innerText = title;
      overlayDesc.innerText = desc;
      overlayBtn.innerText = btnText;
      overlay.classList.remove("hidden");
      isPaused = true;
      pendingAction = action;
    }

    overlayBtn.addEventListener("click", () => {
      sound.init();
      overlay.classList.add("hidden");
      isPaused = false;
      btnPause.innerText = "⏸";
      if (pendingAction) {
        const act = pendingAction;
        pendingAction = null;
        act();
      }
    });

    function togglePause() {
      if (overlay.classList.contains("hidden")) {
        isPaused = !isPaused;
        btnPause.innerText = isPaused ? "▶" : "⏸";
      }
    }

    btnPause.addEventListener("click", togglePause);

    btnSound.addEventListener("click", () => {
      sound.muted = !sound.muted;
      btnSound.innerText = sound.muted ? "🔇" : "🔊";
    });

    function triggerLevelSuccess() {
      sound.playLevelUp();
      spawnParticles(snake.x, snake.y, "#58a6ff", 25);

      if (currentLevel < maxLevels) {
        showOverlay(
          `¡Nivel ${currentLevel} Superado!`,
          `¡Excelente! Preparando Nivel ${currentLevel + 1}. Mantenes tu posición y longitud.`,
          "Siguiente Nivel",
          () => loadLevel(currentLevel + 1)
        );
      } else {
        showOverlay(
          "🏆 ¡FELICIDADES!",
          "¡Has superado los 20 Niveles del juego con éxito!",
          "Jugar de Nuevo",
          () => resetGame()
        );
      }
    }

    function triggerGameOver(reason) {
      sound.playGameOver();
      spawnParticles(snake.x, snake.y, "#f85149", 30);

      showOverlay(
        "¡Juego Terminado!",
        reason,
        "Reintentar",
        () => resetGame()
      );
    }

    function resetGame() {
      score = 0;
      scoreElement.innerText = score;
      inputsQueue = [];

      snake.x = 160;
      snake.y = 160;
      snake.dx = grid;
      snake.dy = 0;
      snake.maxCells = 4;
      snake.cells = [];
      for (let i = 0; i < snake.maxCells; i++) {
        snake.cells.push({ x: 160 - (i * grid), y: 160 });
      }

      loadLevel(1);
    }

    // --- BUCLE PRINCIPAL ---
    function loop() {
      requestAnimationFrame(loop);

      if (isPaused) return;

      const config = getLevelConfig(currentLevel);

      if (++count < config.speedStep) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameElements();
        updateAndDrawParticles();
        return;
      }
      count = 0;

      if (inputsQueue.length > 0) {
        const nextDir = inputsQueue.shift();
        snake.dx = nextDir.dx;
        snake.dy = nextDir.dy;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snake.x += snake.dx;
      snake.y += snake.dy;

      if (snake.x < 0) snake.x = canvas.width - grid;
      else if (snake.x >= canvas.width) snake.x = 0;

      if (snake.y < 0) snake.y = canvas.height - grid;
      else if (snake.y >= canvas.height) snake.y = 0;

      snake.cells.unshift({ x: snake.x, y: snake.y });

      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      if (goldenApple) {
        goldenApple.timer--;
        if (goldenApple.timer <= 0) goldenApple = null;
      }

      let ateApple = false;
      let ateGolden = false;
      let crashedSelf = false;
      let crashedObs = false;

      snake.cells.forEach((cell, index) => {
        if (cell.x === apple.x && cell.y === apple.y) {
          ateApple = true;
        }

        if (goldenApple && cell.x === goldenApple.x && cell.y === goldenApple.y) {
          ateGolden = true;
        }

        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            crashedSelf = true;
          }
        }

        for (let obs of obstacles) {
          if (cell.x === obs.x && cell.y === obs.y) {
            crashedObs = true;
          }
        }
      });

      if (crashedSelf) {
        triggerGameOver("Chocaste con tu propio cuerpo.");
        return;
      }

      if (crashedObs) {
        triggerGameOver("Chocaste con un obstáculo.");
        return;
      }

      if (ateApple) {
        sound.playEat();
        spawnParticles(apple.x, apple.y, "#f85149", 12);
        snake.maxCells++;
        score += 10;
        scoreElement.innerText = score;
        updateProgressBar();

        if (score > highScore) {
          highScore = score;
          highScoreElement.innerText = highScore;
          localStorage.setItem("snakeHighScoreLevels", highScore);
        }

        if (score >= config.targetScore) {
          triggerLevelSuccess();
        } else {
          trySpawnGoldenApple();
          placeApple();
        }
      }

      if (ateGolden) {
        sound.playGolden();
        spawnParticles(goldenApple.x, goldenApple.y, "#e3b341", 20);
        score += 30;
        scoreElement.innerText = score;
        updateProgressBar();
        goldenApple = null;

        if (score > highScore) {
          highScore = score;
          highScoreElement.innerText = highScore;
          localStorage.setItem("snakeHighScoreLevels", highScore);
        }

        if (score >= config.targetScore) {
          triggerLevelSuccess();
        }
      }

      drawGameElements();
      updateAndDrawParticles();
    }

    // --- DIBUJO DE ELEMENTOS EN CANVAS ---
    function drawGameElements() {
      ctx.fillStyle = "#3a4354";
      obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.roundRect(obs.x + 1, obs.y + 1, grid - 2, grid - 2, 4);
        ctx.fill();
      });

      ctx.fillStyle = "#f85149";
      ctx.shadowColor = "#f85149";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(apple.x + grid / 2, apple.y + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (goldenApple) {
        ctx.fillStyle = "#e3b341";
        ctx.shadowColor = "#e3b341";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(goldenApple.x + grid / 2, goldenApple.y + grid / 2, grid / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(227, 179, 65, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        const pct = goldenApple.timer / 120;
        ctx.arc(goldenApple.x + grid / 2, goldenApple.y + grid / 2, grid / 2 + 2, 0, Math.PI * 2 * pct);
        ctx.stroke();
      }

      snake.cells.forEach((cell, index) => {
        const isHead = (index === 0);

        if (isHead) {
          ctx.fillStyle = "#2ea043";
          ctx.beginPath();
          ctx.roundRect(cell.x, cell.y, grid - 1, grid - 1, 6);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          let eyeX1 = cell.x + 5, eyeY1 = cell.y + 5;
          let eyeX2 = cell.x + 13, eyeY2 = cell.y + 5;

          if (snake.dx === grid) { eyeX1 = cell.x + 12; eyeX2 = cell.x + 12; eyeY1 = cell.y + 4; eyeY2 = cell.y + 12; }
          else if (snake.dx === -grid) { eyeX1 = cell.x + 4; eyeX2 = cell.x + 4; eyeY1 = cell.y + 4; eyeY2 = cell.y + 12; }
          else if (snake.dy === grid) { eyeY1 = cell.y + 12; eyeY2 = cell.y + 12; eyeX1 = cell.x + 4; eyeX2 = cell.x + 12; }

          ctx.beginPath();
          ctx.arc(eyeX1, eyeY1, 2, 0, Math.PI * 2);
          ctx.arc(eyeX2, eyeY2, 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const opacity = Math.max(0.3, 1 - (index / snake.cells.length) * 0.6);
          ctx.fillStyle = `rgba(46, 160, 67, ${opacity})`;
          ctx.beginPath();
          ctx.roundRect(cell.x + 1, cell.y + 1, grid - 3, grid - 3, 4);
          ctx.fill();
        }
      });
    }

    // --- CONTROLES Y NAVEGACIÓN ---
    function queueInput(dir) {
      if (isPaused) return;

      const lastDir = inputsQueue.length > 0
        ? inputsQueue[inputsQueue.length - 1]
        : { dx: snake.dx, dy: snake.dy };

      if (dir === "UP" && lastDir.dy === 0) {
        inputsQueue.push({ dx: 0, dy: -grid });
      } else if (dir === "DOWN" && lastDir.dy === 0) {
        inputsQueue.push({ dx: 0, dy: grid });
      } else if (dir === "LEFT" && lastDir.dx === 0) {
        inputsQueue.push({ dx: -grid, dy: 0 });
      } else if (dir === "RIGHT" && lastDir.dx === 0) {
        inputsQueue.push({ dx: grid, dy: 0 });
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") queueInput("LEFT");
      else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") queueInput("UP");
      else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") queueInput("RIGHT");
      else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") queueInput("DOWN");
      else if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
    });

    document.getElementById("btn-up").addEventListener("click", () => queueInput("UP"));
    document.getElementById("btn-down").addEventListener("click", () => queueInput("DOWN"));
    document.getElementById("btn-left").addEventListener("click", () => queueInput("LEFT"));
    document.getElementById("btn-right").addEventListener("click", () => queueInput("RIGHT"));

    // Gestos Táctiles (Swipe)
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault(); // Evita scroll o zoom accidental en móvil
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 20) queueInput("RIGHT");
        else if (diffX < -20) queueInput("LEFT");
      } else {
        if (diffY > 20) queueInput("DOWN");
        else if (diffY < -20) queueInput("UP");
      }
    }, false);

    // Inicialización del juego
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
